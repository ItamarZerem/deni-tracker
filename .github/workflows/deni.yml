# ‏בדיקה בלי ספוילרים. ‏רצה כל 10 דקות (בדקות 4, 14, 24...: ריצות בראש השעה מתעכבות
# ‏יותר ב-GitHub), ו-tracker.py מחליט לבד אם יש משחק קרוב. ‏מחוץ לחלונות - יוצאת מיד.
#
# 🔴 ‏הריפו חייב להיות ציבורי: ב-GitHub Free תזמון (schedule) לא רץ בריפו פרטי בכלל.
# ‏הוכח ב-22.10.26: 9 שעות, אפס ריצות מתוזמנות, גם ב-workflow מינימלי של כל 5 דקות.
# ‏הסימן: בדף ה-workflow מופיע רק «has a workflow_dispatch event trigger».
# ‏אחרי מעבר לציבורי צריך לדחוף שינוי לקובץ הזה, אחרת התזמון לא נרשם מחדש.
name: deni

on:
  workflow_dispatch:
  schedule:
    - cron: '4-59/10 * * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pypdf
      - run: python3 tracker.py check
