# ‏שתי עבודות בכל ריצה:
#  · check - ההתראות הפרטיות לאיתמר, בלי ספוילרים (tracker.py).
#  · channel - הבוט של ערוץ הטלגרם «עדכונים דני אבדיה» (channel.py), עם תוצאות וסטטיסטיקה.
#
# ‏טריגרים:
#  · workflow_dispatch בלי פרמטרים (mode=check) - הטריגר הראשי: cron-job.org קורא ל-API של
#    GitHub כל 5 דקות (ראו CLAUDE.md). ‏שני הסקריפטים מחליטים לבד אם יש משחק קרוב, ומחוץ
#    לחלונות יוצאים מיד.
#  · workflow_dispatch עם mode=watch - מצב «שמירה» הישן: נשאר חי לאורך כל חלון המשחק הקרוב.
#    ‏מיותר כל עוד cron-job.org פועל.
#  · schedule - גיבוי. ‏🔴 ‏GitHub מפעיל אותו רק פעם ב-2 עד 5 שעות בריפו הזה (ראו CLAUDE.md).
#  · push על הקובץ הזה - רק כדי «להעיר» את הרישום של schedule; לא בודק כלום.
name: deni

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = בדיקה אחת · watch = מצב שמירה לאורך כל המשחק'
        type: choice
        options: [check, watch]
        default: check
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml']
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'

permissions:
  contents: read
  actions: write   # ‏כדי שמצב «שמירה» יוכל להפעיל את עצמו מחדש

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pypdf
      - if: github.event_name == 'schedule' || inputs.mode == 'check'
        run: python3 tracker.py check
      - if: inputs.mode == 'watch'
        id: watch
        run: python3 -u tracker.py watch
      - if: steps.watch.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref main -f mode=watch

  channel:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ‏ריצה אחת בכל פעם, כדי ששתי ריצות לא יפרסמו את אותה הודעה
    concurrency:
      group: channel
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pypdf pillow python-bidi
      # ‏המצב (מה כבר פורסם, מה איתמר בחר) נשמר ב-cache ולא בריפו: אין קומיטים, והוא לא
      # ‏גלוי לציבור. ‏כל שמירה במפתח חדש, והשחזור לוקח את האחרונה.
      - uses: actions/cache/restore@v4
        with:
          path: tgstate
          key: tgstate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tgstate-
      - id: ch
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 channel.py
      - if: always() && steps.ch.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: tgstate
          key: tgstate-${{ github.run_id }}-${{ github.run_attempt }}
