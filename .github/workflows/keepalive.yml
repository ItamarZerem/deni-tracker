# ‏בריפו ציבורי GitHub משבית תזמון אחרי 60 יום בלי פעילות. ‏קומיט קטן פעם בחודש.
# ‏הקובץ מכיל רק תאריך - שום מידע על משחקים. (נדחף מחדש אחרי המעבר לציבורי)
name: keepalive

on:
  schedule:
    - cron: '17 12 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push
