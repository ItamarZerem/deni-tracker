# ‏זמני: בדיקה שהתמונות יוצאות נכון על השרת של GitHub (שם יש raqm). ‏יימחק אחרי הבדיקה.
name: render-test
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow python-bidi
      - run: |
          python3 -c "
          from PIL import features; print('raqm', features.check('raqm'))
          import card
          t={'logo':'https://a.espncdn.com/i/teamlogos/nba/500-dark/por.png','color':'e03a3e','alt':'000000'}
          o={'name':'הלייקרס','logo':'https://a.espncdn.com/i/teamlogos/nba/500-dark/lal.png','color':'552583','alt':'fdb927'}
          h='https://a.espncdn.com/i/headshots/nba/players/full/4683021.png'
          open('a.jpg','wb').write(card.announce_card(t,'חוזרים לעדכן!',['עונת 2026/27','כל משחק של דני ופורטלנד'],h))
          open('p.jpg','wb').write(card.preview_card({'name':'פורטלנד',**t},o,'הלילה 5:00','יום רביעי 28.10','עונה סדירה','בספק למשחק',h))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: cards
          path: '*.jpg'
